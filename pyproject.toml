[project]
name = "Telesto"
version = "0.1.0"
description = "Agentic Framework to build a Oil Prediction model using knowledge base."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling",
    "docling-core",
    "pdfplumber>=0.11.7",
    "pypdf>=6.0.0",
    "pypdf2>=3.0.1",
    "tesserocr>=2.8.0",
    "sqlalchemy",
    "psycopg2-binary",
    "numpy",
    "pgvector",
    "boto3>=1.40.38",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pathlib",
    "pillow>=9.0.0",
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
    "opencv-python>=4.8.0",
    "botocore>=1.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=1.0.0",
]

ocr = [
    "pytesseract>=0.3.10",
    "easyocr>=1.7.0",
    "opencv-python>=4.8.0",
]

s3 = [
    "boto3>=1.40.38",
    "botocore>=1.31.0",
]



[project.scripts]
telesto-parse = "pipeline.parsing:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
